env: prod

http:
  host: "0.0.0.0"
  port: 8080

logger:
  level: "info"
  format: "json"
  outputs: ["stdout", "file"]
  file:
    path: "/var/log/gym/app.log"
    max_size_mb: 100
    max_age_days: 30
    max_backups: 10
    compress: true

# Hosts and credentials are expected to come from GYM_* env vars on real prod.
mysql:
  host: "localhost"
  port: 3306
  user: "gym"
  password: "gym"
  database: "gym"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

asynq:
  concurrency: 10
  queues:
    critical: 6
    default: 3
    maintenance: 1
