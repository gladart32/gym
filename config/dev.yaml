env: dev

http:
  host: "0.0.0.0"
  port: 8080

logger:
  level: "debug"
  format: "text"
  outputs: ["stdout", "file"]
  file:
    path: "logs/app.log"
    max_size_mb: 10
    max_age_days: 7
    max_backups: 3
    compress: true

mysql:
  host: "localhost"
  port: 3306
  user: "gym"
  password: "gym"
  database: "gym"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

asynq:
  concurrency: 10
  queues:
    critical: 6
    default: 3
    maintenance: 1
